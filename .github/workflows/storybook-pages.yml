name: Publish Storybook

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published GitHub Release tag to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: storybook-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
          persist-credentials: false
      - name: Install unzip for Bun setup
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends unzip
      - name: Set up Bun
        id: bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Cache Bun package downloads
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
      - name: Set up Just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install the maintained npm client
        run: npm install --global npm@12.2.0
      - name: Verify the published release and package version
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        with:
          script: |
            const { readFile } = require("node:fs/promises");
            const { data: release } = await github.rest.repos.getReleaseByTag({
              ...context.repo,
              tag: process.env.RELEASE_TAG,
            });
            const { version } = JSON.parse(await readFile("package.json", "utf8"));
            if (release.draft || release.tag_name !== process.env.RELEASE_TAG || process.env.RELEASE_TAG !== `v${version}`) {
              throw new Error("A published release matching the package version is required");
            }
      - name: Install dependencies
        run: just install-dependencies
      - name: Register Playwright browsers
        run: just install-browsers
      - name: Check types
        run: just typecheck
      - name: Check lint and formatting
        run: just lint
      - name: Verify package rendering
        run: just test-package
      - name: Build Storybook
        run: just build-storybook
      - name: Upload Storybook
        uses: actions/upload-pages-artifact@v5
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy Storybook
        id: deployment
        uses: actions/deploy-pages@v5
