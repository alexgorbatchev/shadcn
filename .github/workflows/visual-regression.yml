name: Visual regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Source revision to validate
        default: ""
        type: string

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bun x --bun playwright install --with-deps chromium
      - name: Compare screenshots
        run: bun run test:visual
      - name: Upload visual failure images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-failures
          path: .tmp/visual-attachments
          include-hidden-files: true
          retention-days: 14
