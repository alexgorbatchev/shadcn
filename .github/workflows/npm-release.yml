name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published GitHub Release tag to retry
        required: true
        type: string
      prerelease:
        description: Publish a prerelease to the next npm tag
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  visual:
    uses: ./.github/workflows/visual-regression.yml
    with:
      ref: ${{ inputs.release_tag || github.event.release.tag_name }}

  publish:
    needs: visual
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Verify the published GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease || github.event.release.prerelease || false }}
        run: |
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease | bun -e '
            const release = await Bun.stdin.json();
            if (release.isDraft || String(release.isPrerelease) !== Bun.env.RELEASE_PRERELEASE) {
              throw new Error("A published release with matching prerelease status is required");
            }
          '
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease || github.event.release.prerelease || false }}
        run: |
          bun -e '
            const { version } = await Bun.file("package.json").json();
            if (Bun.env.RELEASE_TAG !== `v${version}`) {
              throw new Error(`Release tag must be v${version}`);
            }
            if (version.includes("-") && Bun.env.RELEASE_PRERELEASE !== "true") {
              throw new Error("A prerelease package version requires a GitHub prerelease");
            }
          '
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Set up npm
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check types
        run: bun run typecheck
      - name: Check lint and formatting
        run: bun run lint
      - name: Verify package rendering
        run: bun run test:package
      - name: Publish package with trusted publishing
        env:
          NPM_DIST_TAG: ${{ (inputs.prerelease || github.event.release.prerelease) && 'next' || 'latest' }}
        run: npm publish --access public --tag "$NPM_DIST_TAG" --provenance --loglevel verbose
