name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published GitHub Release tag to retry
        required: true
        type: string
      prerelease:
        description: Publish a prerelease to the next npm tag
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  visual:
    uses: ./.github/workflows/visual-regression.yml
    with:
      ref: ${{ inputs.release_tag || github.event.release.tag_name }}

  publish:
    needs: visual
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
          persist-credentials: false
      - name: Set up Bun
        id: bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Cache Bun package downloads
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
      - name: Set up Just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"
      - name: Verify the published GitHub Release
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease || github.event.release.prerelease || false }}
        with:
          script: |
            const { data: release } = await github.rest.repos.getReleaseByTag({
              ...context.repo,
              tag: process.env.RELEASE_TAG,
            });
            if (release.draft || String(release.prerelease) !== process.env.RELEASE_PRERELEASE) {
              throw new Error("A published release with matching prerelease status is required");
            }
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease || github.event.release.prerelease || false }}
        run: |
          bun -e '
            const { version } = await Bun.file("package.json").json();
            if (Bun.env.RELEASE_TAG !== `v${version}`) {
              throw new Error(`Release tag must be v${version}`);
            }
            if (version.includes("-") && Bun.env.RELEASE_PRERELEASE !== "true") {
              throw new Error("A prerelease package version requires a GitHub prerelease");
            }
          '
      - name: Install dependencies
        run: just install-dependencies
      - name: Set up npm
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install the maintained npm client
        run: npm install --global npm@12.2.0
      - name: Register Playwright browsers
        run: just install-browsers
      - name: Check types
        run: just typecheck
      - name: Check lint and formatting
        run: just lint
      - name: Verify prototype runner and recipes
        run: just test-prototype
      - name: Verify package rendering
        run: just test-package
      - name: Publish package with trusted publishing
        env:
          NPM_DIST_TAG: ${{ (inputs.prerelease || github.event.release.prerelease) && 'next' || 'latest' }}
        run: just publish --access public --tag "$NPM_DIST_TAG" --provenance --loglevel verbose
