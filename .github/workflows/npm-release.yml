name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  visual:
    uses: ./.github/workflows/visual-regression.yml

  publish:
    needs: visual
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          bun -e '
            const { version } = await Bun.file("package.json").json();
            if (Bun.env.RELEASE_TAG !== `v${version}`) {
              throw new Error(`Release tag must be v${version}`);
            }
            if (version.includes("-") && Bun.env.RELEASE_PRERELEASE !== "true") {
              throw new Error("A prerelease package version requires a GitHub prerelease");
            }
          '
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Set up npm
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check types
        run: bun run typecheck
      - name: Check lint and formatting
        run: bun run lint
      - name: Verify package rendering
        run: bun run test:package
      - name: Publish package with trusted publishing
        env:
          NPM_DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: npm publish --access public --tag "$NPM_DIST_TAG" --provenance
