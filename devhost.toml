name = "shadcn-alexgorbatchev"

[caddy.global]
bindHost = "0.0.0.0"
http = true

[services.storybook]
primary = true
command = [
  "sh",
  "-c",
  "exec bun ./node_modules/.bin/storybook dev --host 127.0.0.1 --port \"$PORT\" --exact-port --ci --no-open",
]
port = "auto"
bindHost = "127.0.0.1"
host = "shadcn.example.com"
watch = ["src/", ".storybook/"]

[services.storybook.env]
__VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS = "shadcn.example.com"
